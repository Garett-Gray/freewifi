<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free WiFi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef2f7, #d9e2ec);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #111;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 430px;
      padding: 34px;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.18);
      text-align: center;
    }

    .wifi {
      font-size: 62px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 8px 0;
      font-size: 38px;
    }

    p {
      color: #555;
      font-size: 16px;
      margin: 12px 0 26px;
      line-height: 1.4;
    }

    button {
      background: #111;
      color: white;
      border: none;
      padding: 17px 28px;
      font-size: 21px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    button:hover {
      background: #333;
    }

    #video {
      display: none;
      margin-top: 24px;
      width: 100%;
      border-radius: 14px;
      background: #000;
    }

    #backupBtn {
      display: none;
    }

    .small {
      font-size: 12px;
      color: #888;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="wifi">📶</div>

    <h1>Free WiFi</h1>

    <p id="message">
      Tap below to connect to the dorm WiFi network.
    </p>

    <button id="connectBtn" onclick="connectWifi()">
      Connect
    </button>

    <button id="backupBtn" onclick="forcePlay()">
      Finish Connection
    </button>

    <video id="video" controls playsinline preload="auto">
      <source src="rickroll.mp4" type="video/mp4">
      Your browser does not support video playback.
    </video>

    <div class="small">
      Secure campus guest connection
    </div>
  </div>

  <script>
    const video = document.getElementById("video");
    const message = document.getElementById("message");
    const connectBtn = document.getElementById("connectBtn");
    const backupBtn = document.getElementById("backupBtn");

    function connectWifi() {
      connectBtn.style.display = "none";
      message.innerText = "Connecting...";
      video.style.display = "block";

      video.muted = false;
      video.volume = 1;

      video.load();

      video.addEventListener("loadedmetadata", () => {
        video.currentTime = 44;
      }, { once: true });

      video.addEventListener("canplay", () => {
        forcePlay();
      }, { once: true });

      video.addEventListener("error", () => {
        message.innerText = "Connection error. Please try again.";
        backupBtn.style.display = "block";
      }, { once: true });
    }

    function forcePlay() {
      video.currentTime = 44;
      video.muted = false;
      video.volume = 1;

      video.play()
        .then(() => {
          message.innerText = "Connection established.";
          backupBtn.style.display = "none";
        })
        .catch(() => {
          message.innerText = "Tap Finish Connection.";
          backupBtn.style.display = "block";
        });
    }
  </script>
</body>
</html>
