<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free WiFi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef2f7, #d9e2ec);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #111;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 430px;
      padding: 34px;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.18);
      text-align: center;
    }

    .wifi {
      font-size: 62px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 8px 0;
      font-size: 38px;
      letter-spacing: 0.5px;
    }

    p {
      color: #555;
      font-size: 16px;
      margin: 12px 0 26px;
      line-height: 1.4;
    }

    button {
      background: #111;
      color: white;
      border: none;
      padding: 17px 28px;
      font-size: 21px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #333;
    }

    #video {
      display: none;
      margin-top: 24px;
      width: 100%;
      border-radius: 14px;
      background: #000;
    }

    .small {
      font-size: 12px;
      color: #888;
      margin-top: 18px;
    }

    .loader {
      display: none;
      margin: 18px auto 0;
      width: 32px;
      height: 32px;
      border: 4px solid #ddd;
      border-top: 4px solid #111;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="wifi">📶</div>
    <h1>Free WiFi</h1>

    <p id="message">
      Tap below to connect to the dorm WiFi network.
    </p>

    <button id="connectBtn" onclick="connectWifi()">
      Connect
    </button>

    <div class="loader" id="loader"></div>

    <video id="video" controls playsinline preload="auto">
      <source src="rickroll.mp4" type="video/mp4">
      Your browser does not support video playback.
    </video>

    <div class="small">
      Secure campus guest connection
    </div>
  </div>

  <script>
    function connectWifi() {
      const button = document.getElementById("connectBtn");
      const message = document.getElementById("message");
      const loader = document.getElementById("loader");
      const video = document.getElementById("video");

      button.style.display = "none";
      loader.style.display = "block";
      message.innerText = "Connecting...";

      video.style.display = "block";
      video.volume = 1.0;
      video.muted = false;

      function startVideo() {
        video.currentTime = 44;

        const playPromise = video.play();

        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              loader.style.display = "none";
              message.innerText = "Connection established.";
            })
            .catch(() => {
              loader.style.display = "none";
              message.innerText = "Tap play to finish connecting.";
            });
        }
      }

      if (video.readyState >= 1) {
        startVideo();
      } else {
        video.addEventListener("loadedmetadata", startVideo, { once: true });
        video.load();
      }
    }
  </script>
</body>
</html>
