<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free WiFi</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #111;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 430px;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.16);
      text-align: center;
    }

    .wifi {
      font-size: 58px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 8px 0;
      font-size: 36px;
    }

    p {
      color: #555;
      font-size: 16px;
      margin-bottom: 25px;
    }

    button {
      background: #111;
      color: white;
      border: none;
      padding: 16px 28px;
      font-size: 20px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #333;
    }

    #video {
      display: none;
      margin-top: 24px;
      width: 100%;
      border-radius: 14px;
      background: #000;
    }

    .small {
      font-size: 12px;
      color: #888;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="wifi">📶</div>
    <h1>Free WiFi</h1>
    <p id="message">Tap below to connect to the dorm WiFi network.</p>

    <button id="connectBtn" onclick="connectWifi()">Connect</button>

    <video id="video" controls playsinline>
      <source src="PUT-YOUR-MP4-LINK-HERE" type="video/mp4">
      Your browser does not support video playback.
    </video>

    <div class="small">Secure campus guest connection</div>
  </div>

  <script>
    function connectWifi() {
      const button = document.getElementById("connectBtn");
      const message = document.getElementById("message");
      const video = document.getElementById("video");

      button.style.display = "none";
      message.innerText = "Connecting...";

      video.style.display = "block";
      video.currentTime = 44;
      video.volume = 1.0;
      video.muted = false;

      const playPromise = video.play();

      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            message.innerText = "Connection established.";
          })
          .catch(() => {
            message.innerText = "Tap play to finish connecting.";
          });
      }
    }
  </script>
</body>
</html>
